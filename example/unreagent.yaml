# ============================================================
#  unreagent — DEMO configuration (try it right away)
#
#  Runs WITHOUT Unreal Engine and WITHOUT an agent. "ping" (a
#  long-running process that produces log lines) serves as a
#  placeholder "editor".
#  Purpose: test the launcher + MCP server on Windows in 30 seconds.
#
#  For real use: see unreagent.example.yaml.
# ============================================================

unreal:
  # Placeholder instead of a real UnrealEditor.exe:
  editor: ping
  args: ["-n", "999999", "127.0.0.1"]
  restart: on-failure

agent:
  enabled: false          # the "LLM thing" (Claude Code) is external -> off in the demo

mcp:
  enabled: true
  address: 127.0.0.1:8765

permissions:
  enabled: false          # not needed without an agent

runtimes:
  python: { enabled: false }
  node:   { enabled: false }

commands:
  hello:
    description: "Demo command that just prints something"
    command: cmd
    args: ["/c", "echo", "Hello from unreagent run_command!"]
