# ============================================================
#  unreagent — committable project configuration
#
#  Rename this file to  unreagent.yaml  and place it next to the
#  .uproject (and next to unreagent.exe). It is portable and belongs
#  in the project repo.
#
#  NO machine-specific paths here! They are resolved automatically and
#  substituted via placeholders:
#    ${ENGINE}        UE installation root. Resolved in this order: env UE_ROOT,
#                     engineRoot (usually in local.yaml), the .uproject's
#                     EngineAssociation (Launcher version or a registered
#                     source build), then the highest installed version found
#                     via the registry / Epic default paths
#    ${PROJECT}       full path to the .uproject: unreal.project if set,
#                     otherwise the first .uproject next to this file
#    ${PROJECT_DIR}   directory containing the .uproject
#    ${PROJECT_NAME}  name of the .uproject without extension
#
#  Placeholders are replaced in: unreal.editor/args; agent.command/args/env
#  values/workdir; agent.hermes.configPath; permissions.allow/deny; the
#  runtimes' uv/node/npm/project; files.root; skills.dir; commands.<name>.command/args/dir;
#  every string in mcp.extraServers; the mcp.writeConfig paths. They are NOT
#  replaced in unreal.project, engineRoot, mcp.address, mcp.token, names/keys
#  and enums. There is no escape syntax: a literal ${PROJECT} in a Bash(...)
#  rule or in agent.args is replaced too.
#  A placeholder that cannot be resolved (engine or .uproject not found) in a
#  field that is in use is a LOAD ERROR. Exceptions: the built-in compile and
#  package commands are then left out with a warning, and with
#  files.enabled: false an unresolved files.root only disables -files
#  (with files.enabled: true it is a load error).
#
#  Machine-specific overrides (engine path, claude path …) belong in a
#  git-ignored  unreagent.local.yaml  — example at the very bottom.
# ============================================================

agent:
  enabled: true
  command: claude                # default: claude
  # Automatically appends --mcp-config (+ --permission-prompt-tool) to the
  # claude invocation — no manual setup needed.
  claudeIntegration: true
  # Interactive in the foreground (agent inherits the console = real TTY) is the DEFAULT.
  # UE runs in the background, launcher logs -> unreagent.log (previous session kept as unreagent.log.1;
  # if the log cannot be created: a warning on stderr, logs go to the console). Turn off with
  # window: false — e.g. for headless: args: ["-p", "<task>"] (then window off).
  # window: false
  # args: ["-p", "Start and work through the tasks"]   # one-off headless
  # On Windows (with claudeIntegration) CLAUDE_CODE_USE_POWERSHELL_TOOL=1 is
  # set automatically; disable with powershellTool: false.
  # powershellTool: false
  # What happens when the agent exits (e.g. /quit) and isn't restarted?
  # In window mode the agent is the lead process — when it exits, that's it.
  #   ask (default): prompt in the window (stop everything / keep the editor
  #     running -> launcher console / restart the agent; 30s timeout -> stop;
  #     headless without a TTY = shutdown)
  #   shutdown: always stop the whole stack (UE + MCP + launcher) immediately
  #   leave: keep everything running (warning only) — manual Ctrl-C needed
  # onExit: ask
  # Restart policy: never | on-failure (default) | always. maxRestarts: 0 (the
  # default) = no fixed bound, but a fast-fail rule applies: an agent that FAILS
  # 3 times in a row, each within 10s of its start, is not restarted again (one
  # log line says so). A failure is a non-zero exit or a failed start; a clean
  # exit 0, a run longer than 10s, or a manual start/restart resets the count.
  # An explicit maxRestarts > 0 keeps exactly that bound and the rule is off.
  # restart: on-failure
  # maxRestarts: 0             # default 0
  # Seconds to wait before the agent is first started, and between restarts.
  # 0 or unset = the default; below 0 is a load error (the floor of 1 keeps a
  # crashing agent from restarting in a tight loop).
  # startDelaySeconds: 5       # default 5
  # restartDelaySeconds: 3     # default 3
  # env: extra environment variables for the agent (values take placeholders).
  # A map: unreagent.local.yaml merges it by key, so it adds or changes
  # variables and keeps the others.
  # env:
  #   SOME_VARIABLE: "value"

permissions:
  enabled: true
  mode: allow_all            # allow_all | allowlist | deny_all (default if unset: allowlist)
  deny:
    - "Bash(rm -rf *)"
  # `Bash(...)` rules match per shell segment, not the whole command line: the
  # command is split on ; && || | newlines, $(...)/backtick bodies, and a
  # script handed to a nested `bash -c`/`sh -c`. A deny rule blocks if ANY
  # segment matches; an allow rule below only grants if EVERY segment is
  # covered by some allow rule — e.g. "git status | head" needs BOTH
  # "Bash(git *)" and "Bash(head *)". Bracket rules also work on non-Bash
  # tools, matched against their path-like input, e.g. "Write(/etc/*)". On
  # Windows use "PowerShell(...)" instead of "Bash(...)". Full details +
  # caveats: README "### Permission layer".
  #
  # Under mode: allowlist this list is consulted instead — everything not
  # matched by an allow rule is rejected:
  # allow: ["Read", "Edit", "Write", "Bash(git *)", "mcp__unreagent__*"]

runtimes:
  python:
    enabled: true
    prepareOnStart: true     # uv sync on start, if pyproject.toml is present
  node:
    enabled: true

# File tools (read_file/list_dir/write_file/edit_file) via the MCP server.
# Handy together with `-no-agent`: UE + MCP run, an external agent
# connects and works on the project without anyone present locally.
# Quick via flag: unreagent.exe -files   (or -no-agent for UE+MCP only)
files:
  enabled: false
  # default ${PROJECT_DIR}. All paths are confined to it. Absolute symlinks or
  # junctions, and links leading out of the root, are refused (also on the way
  # to a new file); a plugin linked in from outside is unreachable through the
  # link: put it into the project, or point root at a directory holding both and
  # use the plugin's real path. Windows reserved names (NUL, aux.h) are refused.
  root: "${PROJECT_DIR}"
  readOnly: false            # true = read-only

# Skills: UE skill documents shipped inside the launcher. Two delivery paths,
# which may run together:
#   mcp          the `skills` MCP tool; its description lists every skill, so
#                the agent picks one without a list call
#   materialize  the skills as files in dir, rewritten on every start
# Only directories named unreagent-* in dir are replaced or removed (a skill
# that is no longer shipped is removed); everything else there is never touched.
# mcp: false together with materialize: false is a load error, not a no-op.
# Quick via flag: unreagent.exe -no-skills-mcp  (mcp: false, materialize: true;
# wins over this file and unreagent.local.yaml)
# skills:
#   enabled: true            # default true; false turns both paths off
#   mcp: true                # default true
#   materialize: false       # default false
#   # Where the files go. Takes placeholders; a relative path is taken relative
#   # to the agent working directory. UE 5.8 reads <Project>/Skills/:
#   # "${PROJECT_DIR}/Skills" targets it.
#   dir: "${PROJECT_DIR}/.claude/skills"   # default

mcp:
  enabled: true
  # Default 127.0.0.1:8765. If it cannot be bound (port taken, e.g. by a second
  # unreagent), the launcher exits 1 before writing any file; a per-machine
  # port belongs in unreagent.local.yaml.
  address: 127.0.0.1:8765
  # Optional bearer token: when set, the MCP server requires an
  # "Authorization: Bearer <token>" header on every request. Default empty
  # (= open), compatible with prior behavior and local-only setups.
  # Recommendation: set it as soon as the MCP server listens on an address
  # other than 127.0.0.1. The launcher writes the token into the Hermes MCP
  # entry (`unreagent hermes-setup`) and into the embedded agent (Claude
  # Code) automatically — no manual copy needed.
  # token: "changeme-please-rotate"
  # Additional in-editor MCP servers the agent uses to work IN the engine
  # (e.g. UE LLM Toolkit: Node bridge -> HTTP server in the editor on port 3000).
  # Passed together with the unreagent server in --mcp-config.
  # Stdio servers are fully checked before start — every stage complains
  # loudly in the log instead of failing silently:
  #   Binary in PATH? -> Node: script there? node_modules there and marked
  #   (node_modules/.unreagent-installed, written after a passing smoke
  #   test)? (else npm install; if the smoke test still fails, the log
  #   names the repair)
  #   -> smoke test (initialize handshake) -> is UNREAL_MCP_URL reachable?
  # strict: false   # true = ONLY these servers (ignore the project's own .mcp.json)
  # extraServers:
  #   ue-llm-toolkit:
  #     command: node
  #     args: ["${PROJECT_DIR}/Plugins/UELLMToolkit/Resources/mcp-bridge/index.js"]
  #     env:
  #       UNREAL_MCP_URL: "http://127.0.0.1:3000"
  #   # Unreal MCP, built into UE 5.8+ (experimental; enable the "Unreal MCP" and
  #   # "All Toolsets" plugins). Plain HTTP, no Node bridge. Default port 8000 —
  #   # if you change it (Editor Preferences, or -ModelContextProtocolPort in
  #   # unreal.args), change the URL too. HTTP entries get NO launcher checks
  #   # (those run only for stdio entries); if Claude Code reports the server
  #   # as failed because the editor was not up yet, reconnect with /mcp.
  #   # Can run next to the Toolkit above.
  #   unreal-mcp:
  #     type: http
  #     url: "http://127.0.0.1:8000/mcp"
  # NOTE: extraServers is a map keyed by server name — unreagent.local.yaml adds
  # servers and replaces a same-named server's whole definition; the other
  # servers defined here stay. (Lists, e.g. unreal.args, are replaced as a whole.)
  # Also write the MCP config as file(s) (for external clients like
  # your own Claude session, Cursor, VS Code). Also via flag: -write-mcp-config
  # writeConfig: a LIST (unreagent.local.yaml replaces it as a whole). format is
  # mcp_json (default) or vscode — anything else is a load error. A relative
  # path is resolved against agent.workdir (default: the project directory).
  # writeConfig:
  #   - { path: ".mcp.json", format: mcp_json }       # Claude Code / Cursor / Claude Desktop
  #   - { path: ".vscode/mcp.json", format: vscode }  # VS Code

# Hermes Agent (Nous Research) as an alternative agent. Activation is
# explicit via the sub-command `unreagent hermes-setup` — no auto-merge on
# normal start. Setup writes our MCP server (with bearer token) into
# $HERMES_HOME/config.yaml (default ~/.hermes/config.yaml). Only the entry
# mcp_servers.<serverName> is replaced (or appended); comments, key order and
# the other servers stay, but the file is re-encoded, so its formatting is
# normalised (see README). The entry carries a comment that a re-run
# overwrites edits to it. Both files are written atomically; the original is
# copied once to <config>.bak and that backup is never overwritten. A
# generated mcp.token goes into unreagent.local.yaml, and only after the
# merge succeeded. Like a normal start, hermes-setup needs a resolvable
# engine (UE_ROOT / engineRoot).
# agent:
#   hermes:
#     enabled: true
#     # serverName: unreagent     # key under mcp_servers
#     #   Allowed: ASCII letters, digits, "_" and "-", starting with a letter.
#     #   Names YAML reads as boolean or null (yes, no, on, off, true, null,
#     #   ...) are refused at load.
#     #   Empty = the default, unreagent.
#     # configPath: ""            # empty = $HERMES_HOME/config.yaml or ~/.hermes/config.yaml (takes placeholders)

# ------------------------------------------------------------
# unreal: and commands: are OPTIONAL. The editor path as well as the
# "compile" and "package" commands are derived automatically from
# ${ENGINE} + ${PROJECT}. Only override when needed:
#
# compile and package exist only when both ${ENGINE} and ${PROJECT} resolve;
# otherwise they are skipped with a warning at start. A command of the same
# name defined here replaces the built-in.
#
# unreal:
#   # The .uproject to open. Absolute, or relative to the directory of THIS
#   # config file; it must exist, and it takes NO placeholders (they are
#   # derived from it). Default: the first .uproject next to the config.
#   # project: "MyGame/MyGame.uproject"
#   # args REPLACES the default ["-stdout", "-FullStdOutLogOutput"] (the .uproject
#   # is always prepended) — give the full list. A list in local.yaml replaces it
#   # too. Unset or "args: ~" = the default; "args: []" = no extra arguments.
#   args: ["-stdout", "-FullStdOutLogOutput", "-nosplash"]
#   # Restart policy: never | on-failure (default) | always. With maxRestarts: 0
#   # (the default) a fast-fail rule applies: an editor that FAILS (non-zero
#   # exit or failed start) 3 times in a row, each within 10s of its start, is
#   # not restarted again; one log line says so. A clean exit 0, a run longer
#   # than 10s, or a manual ue_start/restart resets the count. An explicit
#   # maxRestarts > 0 keeps exactly that bound and the rule is off.
#   restart: on-failure
#   maxRestarts: 0            # default 0 (5 = give up after 5 restarts)
#   restartDelaySeconds: 3    # default 3 (0 = default); below 0 is a load error
#   unattended: true          # -unattended: no crash dialog + no recovery prompt (default on)
#   killCrashReporter: true   # kill a hanging CrashReportClient(Editor) before each start (default on)
#   cleanOnRestart: false     # remove Saved/Autosaves/PackageRestoreData.json before every start (default off);
#                             # Saved/Crashes is emptied only on the first / a manual start —
#                             # kept on an automatic restart so the crash dump survives
#
# commands:
#   cook:
#     description: "Cook content only"
#     command: "${ENGINE}/Engine/Build/BatchFiles/RunUAT.bat"
#     args: ["BuildCookRun", "-project=${PROJECT}", "-noP4", "-cook", "-skipstage"]
# ------------------------------------------------------------

# ============================================================
#  Example  unreagent.local.yaml  (do NOT commit — git-ignored):
#
#    engineRoot: "D:/UE/UE_5.7"        # if auto-detect fails (a relative path
#                                      # resolves against the working directory)
#    agent:
#      command: "C:/Path/To/claude.exe"  # claude not in PATH
# ============================================================
