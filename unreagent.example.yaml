# ============================================================
#  unreagent — committable project configuration
#
#  This file is OPTIONAL. Without an unreagent.yaml (or unreagent.yml) next
#  to unreagent.exe, the launcher runs on built-in defaults for the one
#  .uproject next to it: agent on (claude, in the window, claudeIntegration),
#  MCP server on, the UE LLM Toolkit bridge added to mcp.extraServers when the
#  plugin is found below Plugins/, permissions OFF.
#  The bridge is found by looking for Resources/mcp-bridge/index.js in a plugin
#  directory up to four levels below Plugins/ (so Plugins/UELLMToolkit and
#  Plugins/ue-llm-toolkit/Plugin/UELLMToolkit both work); hidden directories
#  and node_modules, Binaries, Intermediate, Content, Source and Saved are not
#  entered; shallowest first, then by name; with several, the first is used and
#  a WARN lists them all.
#  Permissions off means unreagent applies no permission policy; Claude Code's
#  own prompts and settings decide.
#  The config is looked for next to the executable, not in the working
#  directory. No .uproject there, or several, is a load error. An
#  unreagent.local.yaml still overlays the defaults, but must not set
#  unreal.project without an unreagent.yaml.
#
#  `unreagent init` writes those defaults out as an unreagent.yaml (it never
#  edits an existing one), with skills.materialize: true added, and prints a
#  preflight. It also writes a starter CLAUDE.md where the project has none,
#  and the shipped skills, topic agents and rules file into .claude/. Or rename
#  THIS file to unreagent.yaml and place it next to the .uproject (and next to
#  unreagent.exe): that leaves skills.materialize at its default, false. The
#  file is portable and belongs in the project repo. The README's "New
#  project" section walks through both.
#
#  NO machine-specific paths here! They are resolved automatically and
#  substituted via placeholders:
#    ${ENGINE}        UE installation root. Resolved in this order: env UE_ROOT,
#                     engineRoot (usually in local.yaml), the .uproject's
#                     EngineAssociation (a Launcher version; a registered
#                     source build; a value with / or \ is an engine root,
#                     relative to the .uproject's folder or absolute; blank,
#                     missing or not a string means the engine tree the
#                     project sits in, the nearest folder above the .uproject's
#                     folder with Engine/Binaries and Engine/Build; the .uproject may be
#                     UTF-8 with or without BOM, or UTF-16 LE/BE with BOM),
#                     then the highest installed version with an editor
#                     binary (unreagent's own fallback, for a project outside
#                     any engine tree). Launcher installs are looked up in
#                     %ProgramData%\Epic\UnrealEngineLauncher\
#                     LauncherInstalled.dat (entries named UE_<version>), then
#                     in the HKLM\SOFTWARE\EpicGames\Unreal Engine\<version>\
#                     InstalledDirectory registry key as a fallback, then in
#                     the Epic default install paths. For a version listed in
#                     both, the .dat's directory is used unless it has no
#                     editor binary, then the registry's. The highest-version
#                     step logs a WARN when the project names an engine that is
#                     not usable (not installed, installed without an editor
#                     binary, a path that is no engine root, or an engine tree
#                     without an editor binary): the editor then opens the
#                     project with the engine picked, not the one it names.
#    ${PROJECT}       full path to the .uproject: unreal.project if set,
#                     otherwise the first .uproject next to this file
#    ${PROJECT_DIR}   directory containing the .uproject
#    ${PROJECT_NAME}  name of the .uproject without extension
#
#  Placeholders are replaced in: unreal.editor/args; agent.command/args/env
#  values/workdir; agent.hermes.configPath; permissions.allow/deny; the
#  runtimes' uv/node/npm/project; files.root; skills.dir; commands.<name>.command/args/dir;
#  every string in mcp.extraServers; the mcp.writeConfig paths. They are NOT
#  replaced in unreal.project, engineRoot, mcp.address, mcp.token, names/keys
#  and enums. There is no escape syntax: a literal ${PROJECT} in a Bash(...)
#  rule or in agent.args is replaced too.
#  A placeholder that cannot be resolved (engine or .uproject not found) in a
#  field that is in use is a LOAD ERROR. Exceptions: the built-in compile and
#  package commands are then left out with a warning, and with
#  files.enabled: false an unresolved files.root only disables -files
#  (with files.enabled: true it is a load error).
#
#  Machine-specific overrides (engine path, claude path …) belong in a
#  git-ignored  unreagent.local.yaml  — example at the very bottom.
#  Each file is a single YAML document: content after a second '---' is a
#  load error. A symlinked unreagent.local.yaml that leads to no file is a
#  load error too, not a missing overlay.
# ============================================================

agent:
  enabled: true
  command: claude                # default: claude
  # Automatically appends --mcp-config <file> to the claude invocation — no manual
  # setup needed. The file is a private temp file (mcp-config.json in an
  # unreagent-* directory under TMPDIR / %TMP%), removed when the launcher exits.
  # With permissions.enabled it also appends --permission-prompt-tool,
  # but only to a headless agent (not window: true; with window unset, -p/--print
  # in args), and not when agent.args already holds one; see "permissions" below.
  claudeIntegration: true
  # Interactive in the foreground (agent inherits the console = real TTY) is the DEFAULT.
  # UE runs in the background, launcher logs -> unreagent.log (previous session kept as unreagent.log.1;
  # the startup lines printed before that switch are replayed into the log (original times);
  # the launcher console's replies, start/stop/restart outcomes and onExit leave/shutdown
  # lines show on the console as well, led by how the agent ended; each retried failed agent
  # start and each automatic restart of the agent or the editor prints one console line, as do
  # the editor's give-up, a restart held for its crash reporter and the startup WARNs;
  # if the log cannot be created: a warning on stderr, logs go to the console). Turn off with
  # window: false — e.g. for headless: args: ["-p", "<task>"] (then window off).
  # window: false
  # args: ["-p", "Start and work through the tasks"]   # one-off headless
  # On Windows (with claudeIntegration) CLAUDE_CODE_USE_POWERSHELL_TOOL=1 is
  # set automatically; disable with powershellTool: false.
  # powershellTool: false
  # What happens when the agent exits (e.g. /quit) and isn't restarted?
  # In window mode the agent is the lead process — when it exits, that's it.
  #   ask (default): prompt in the window (stop everything / keep the editor
  #     running -> launcher console / restart the agent; 30s timeout -> stop;
  #     headless without a TTY = shutdown)
  #   shutdown: always stop the whole stack (UE + MCP + launcher) immediately
  #   leave: keep everything running (warning only) — manual Ctrl-C needed
  # onExit: ask
  # Restart policy: never | on-failure (default) | always. maxRestarts: 0 (the
  # default) = no fixed bound, but a fast-fail rule applies: an agent that FAILS
  # 3 times in a row, each within 10s of its start, is not restarted again (one
  # log line says so). A failure is a non-zero exit or a failed start; a clean
  # exit 0, a run longer than 10s, or a manual start/restart resets the count.
  # An explicit maxRestarts > 0 keeps exactly that bound and the rule is off.
  # restart: on-failure
  # maxRestarts: 0             # default 0
  # Seconds to wait before the agent is first started, and between restarts.
  # 0 or unset = the default; below 0 is a load error (the floor of 1 keeps a
  # crashing agent from restarting in a tight loop).
  # startDelaySeconds: 5       # default 5
  # restartDelaySeconds: 3     # default 3
  # env: extra environment variables for the agent (values take placeholders).
  # A map: unreagent.local.yaml merges it by key, so it adds or changes
  # variables and keeps the others.
  # env:
  #   SOME_VARIABLE: "value"

# The policy applies ONLY to a headless Claude Code agent with claudeIntegration
# (args: ["-p", "<task>"]). An interactive agent (the default window mode) never
# consults it: allow_all passes --dangerously-skip-permissions (deny rules are
# not applied), the other modes leave the prompts to Claude Code in its window.
# So with enabled: true and an interactive agent (agent.window: true, or
# agent.window unset and no -p/--print in agent.args) the launcher logs a "WARN
# permissions are not enforced" line at startup (and prints it to stderr when
# the log is a file) and starts anyway. The same WARN appears when
# agent.claudeIntegration is false. No warning without an agent (-no-agent / agent.enabled: false).
# This example keeps it off for that reason; set it true together with a -p task.
permissions:
  enabled: false             # default false
  mode: allow_all            # allow_all | allowlist | deny_all (default if unset: allowlist)
  deny:
    - "Bash(rm -rf *)"
  # `Bash(...)` rules match per shell segment, not the whole command line: the
  # command is split on ; && || | newlines, $(...)/backtick bodies, and a
  # script handed to a nested `bash -c`/`sh -c`. A deny rule blocks if ANY
  # segment matches; an allow rule below only grants if EVERY segment is
  # covered by some allow rule — e.g. "git status | head" needs BOTH
  # "Bash(git *)" and "Bash(head *)". Bracket rules also work on non-Bash
  # tools, matched against their path-like input, e.g. "Write(/etc/*)". On
  # Windows use "PowerShell(...)" instead of "Bash(...)". Full details +
  # caveats: README "### Permission layer".
  #
  # Under mode: allowlist this list is consulted instead — everything not
  # matched by an allow rule is rejected:
  # allow: ["Read", "Edit", "Write", "Bash(git *)", "mcp__unreagent__*"]

runtimes:
  python:
    enabled: true
    prepareOnStart: true     # uv sync on start, if pyproject.toml is present; a failed
                             # sync (or a missing uv) is a WARN with the last 20 output lines
                             # (window mode: its first line also on stderr)
  node:
    enabled: true

# File tools (read_file/list_dir/write_file/edit_file) via the MCP server.
# Handy together with `-no-agent`: UE + MCP run, an external agent
# connects and works on the project without anyone present locally.
# Quick via flag: unreagent.exe -files   (or -no-agent for UE+MCP only)
files:
  enabled: false
  # default ${PROJECT_DIR}. All paths are confined to it. Absolute symlinks or
  # junctions, and links leading out of the root, are refused (also on the way
  # to a new file); a plugin linked in from outside is unreachable through the
  # link: put it into the project, or point root at a directory holding both and
  # use the plugin's real path. Windows reserved names (NUL, aux.h) are refused.
  root: "${PROJECT_DIR}"
  readOnly: false            # true = read-only

# Skills: UE skill documents shipped inside the launcher. Two delivery paths,
# which may run together:
#   mcp          the `skills` MCP tool; its description lists every skill, so
#                the agent picks one without a list call
#   materialize  the skills as files in dir, rewritten on every start
# Only directories named unreagent-* in dir are replaced or removed (a skill
# that is no longer shipped is removed); everything else there is never touched.
# mcp: false together with materialize: false is a load error, not a no-op.
# Quick via flag: unreagent.exe -no-skills-mcp  (mcp: false, materialize: true;
# wins over this file and unreagent.local.yaml)
# skills:
#   enabled: true            # default true; false turns both paths off
#   mcp: true                # default true
#   materialize: false       # default false; the unreagent.yaml that
#                            # `unreagent init` writes sets it to true
#   # Where the files go. Takes placeholders; a relative path is taken relative
#   # to the agent working directory. UE 5.8 reads <Project>/Skills/:
#   # "${PROJECT_DIR}/Skills" targets it.
#   dir: "${PROJECT_DIR}/.claude/skills"   # default
#   # Claude Code only, and only with materialize: true. When dir is
#   # <project>/.claude/skills, every start also writes the shipped topic
#   # agents (.claude/agents/unreagent-<name>.md, subagents that pre-load a few
#   # skills) and the rules file (.claude/rules/unreagent.md), and refreshes
#   # them while unedited. A file you edited, or one of that name the launcher
#   # did not write, is never overwritten or deleted: one WARN names it, and
#   # deleting it gets the shipped version back. Setting this to false (or
#   # materialize off) removes nothing already written. With dir elsewhere,
#   # none are written and the log says why.
#   agents: true             # default true

mcp:
  enabled: true
  # Default 127.0.0.1:8765. host:port with a port 1-65535 and a host that is
  # empty, an IP address (IPv6 in brackets, no zone such as %eth0) or a name
  # of ASCII letters, digits, "-", "_" and "."; anything else is a load
  # error. An empty or wildcard host (:8765, 0.0.0.0:8765) listens on
  # every interface; the agent, mcp.writeConfig and hermes-setup then get
  # http://127.0.0.1:<port>/mcp. If it cannot be bound (port taken, e.g. by a
  # second unreagent), the launcher exits 1 before writing any file; a
  # per-machine port belongs in unreagent.local.yaml.
  address: 127.0.0.1:8765
  # Optional bearer token: when set, the MCP server requires an
  # "Authorization: Bearer <token>" header on every request. Default empty
  # (= open), compatible with prior behavior and local-only setups.
  # Recommendation: set it as soon as the MCP server listens on an address
  # other than 127.0.0.1. The launcher writes the token into the Hermes MCP
  # entry (`unreagent hermes-setup`) and into the embedded agent (Claude
  # Code) automatically — no manual copy needed.
  # token: "changeme-please-rotate"
  # Browser Origins the MCP server accepts. Default: absent, which means the
  # built-in allowlist: http/https on localhost, 127.0.0.1 and [::1], any port.
  # Only browser-based MCP clients send an Origin header; a request without
  # one (Claude Code, Hermes, curl) is always accepted, and mcp.token stays the
  # access control. A non-empty list REPLACES the built-in allowlist, so list
  # a loopback client too if it still needs access. Each entry is an origin as
  # the browser sends it: scheme://host[:port], http or https. Refused (load
  # error naming the index and value, checked while mcp.enabled is on): path
  # (not even "/"), query, fragment, user info, wildcards, an explicit default
  # port (https://h:443), leading zeros in the port, a non-ASCII host (use
  # punycode), a host character the URL Standard forbids (< > ^ | and the
  # like) or a "%" in the host, "null", file/ftp/ws/wss. A browser extension
  # is accepted as exactly scheme://host, no port, path or forbidden host
  # character: chrome-extension://<id>,
  # moz-extension://<uuid>, vscode-webview://<id>.
  # IP hosts must be in the form a browser sends, or they never match:
  # dotted-quad IPv4 without leading zeros (127.1, 0x7f.0.0.1 and
  # 2130706433 are refused, write http://127.0.0.1), IPv6 bracketed and
  # compressed (http://[::1], not [0:0:0:0:0:0:0:1]), no zone.
  # Exact, case-insensitive match; no placeholders are substituted.
  # A LIST: unreagent.local.yaml replaces it whole;
  # "allowedOrigins: []" or "~" there clears it (built-in allowlist is back).
  # allowedOrigins:
  #   - https://ide.example.com
  #   - http://localhost:5173
  # Additional in-editor MCP servers the agent uses to work IN the engine
  # (e.g. UE LLM Toolkit: Node bridge -> HTTP server in the editor on port 3000).
  # Passed together with the unreagent server in --mcp-config.
  # Stdio servers are fully checked before start — every stage complains
  # loudly instead of failing silently (in the log; in window mode a WARN's
  # first line also on stderr):
  #   Binary in PATH? -> Node: script there? node_modules there and marked
  #   (node_modules/.unreagent-installed, written after a passing smoke
  #   test)? (else npm install --no-save, retried once with
  #   --no-save --legacy-peer-deps on an ERESOLVE or code-less failure; if the smoke test still fails, the log
  #   names the repair)
  #   -> smoke test (initialize handshake: only an id-1 result with a
  #   serverInfo object passes; any other id-1 response fails at once (an
  #   error names its code and message, a result without serverInfo says
  #   so); other lines are skipped, 20 s timeout)
  #   -> is UNREAL_MCP_URL reachable?
  # strict: false   # true = ONLY these servers (ignore the project's own .mcp.json)
  # extraServers:
  #   ue-llm-toolkit:
  #     command: node
  #     args: ["${PROJECT_DIR}/Plugins/UELLMToolkit/Resources/mcp-bridge/index.js"]
  #     env:
  #       UNREAL_MCP_URL: "http://127.0.0.1:3000"
  #   # Unreal MCP, built into UE 5.8+ (experimental). Plain HTTP, no Node bridge.
  #   # Needs BOTH: the "Unreal MCP" (ModelContextProtocol) and "All Toolsets"
  #   # plugins enabled (both are off by default) AND the server started: it
  #   # does not start on its own, only with -ModelContextProtocolStartServer
  #   # on the editor command line (or its "Auto Start Server" setting).
  #   # unreal.args REPLACES the default list ["-stdout", "-FullStdOutLogOutput"]
  #   # as a whole, so write the defaults too (nested YAML, top level):
  #   #   unreal:
  #   #     args: ["-stdout", "-FullStdOutLogOutput",
  #   #            "-ModelContextProtocolStartServer"]
  #   # Default port 8000 — if you change it (Editor Preferences, or
  #   # -ModelContextProtocolPort=<port> in unreal.args), change the URL too.
  #   # HTTP / SSE entries get no smoke
  #   # test, only a reachability watch: after bridge preparation the launcher
  #   # tries a TCP connect to the URL's host and port for 5 minutes and logs
  #   # "is reachable" or a warning (connect only, no MCP session; the agent
  #   # still starts at once; scheme, host and path are logged, never user
  #   # info or query). If Claude Code reports the server as failed because
  #   # the editor was not up yet, reconnect with /mcp.
  #   # Can run next to the Toolkit above.
  #   unreal-mcp:
  #     type: http
  #     url: "http://127.0.0.1:8000/mcp"
  # NOTE: extraServers is a map keyed by server name — unreagent.local.yaml adds
  # servers and replaces a same-named server's whole definition; the other
  # servers defined here stay. (Lists, e.g. unreal.args, are replaced as a whole.)
  # Also write the MCP config as file(s) (for external clients like
  # your own Claude session, Cursor, VS Code). Also via flag: -write-mcp-config
  # writeConfig: a LIST (unreagent.local.yaml replaces it as a whole). format is
  # mcp_json (default) or vscode — anything else is a load error. A relative
  # path is resolved against agent.workdir (default: the project directory).
  # The files hold mcp.token when it is set, so they are written with mode 0600,
  # atomically through a temp file <name>.tmp-<digits> in the file's directory,
  # which must be writable (else the old file is left untouched and a WARN is
  # logged). An existing file open to group or others comes out 0600 (the log
  # names the old mode). Unix only: on Windows the mode is not handled. With a
  # token, a file inside the project directory that git does not ignore gets a
  # WARN (in window mode also on stderr): add it to .gitignore, and if git
  # already tracks it, git rm --cached it too. Default: not set (no files).
  # writeConfig:
  #   - { path: ".mcp.json", format: mcp_json }       # Claude Code / Cursor / Claude Desktop
  #   - { path: ".vscode/mcp.json", format: vscode }  # VS Code

# Hermes Agent (Nous Research) as an alternative agent. Activation is
# explicit via the sub-command `unreagent hermes-setup` — no auto-merge on
# normal start. Setup writes our MCP server (with bearer token) into
# $HERMES_HOME/config.yaml (default ~/.hermes/config.yaml). Only the entry
# mcp_servers.<serverName> is replaced (or appended); comments, key order and
# the other servers stay, but the file is re-encoded, so its formatting is
# normalised (see README). The entry carries a comment that a re-run
# overwrites edits to it. Both files are written atomically; the original is
# copied once to <config>.bak and that backup is never overwritten. A
# generated mcp.token goes into unreagent.local.yaml, and only after the
# merge succeeded. Like a normal start, hermes-setup needs a resolvable
# engine (UE_ROOT / engineRoot).
# agent:
#   hermes:
#     enabled: true
#     # serverName: unreagent     # key under mcp_servers
#     #   Allowed: ASCII letters, digits, "_" and "-", starting with a letter.
#     #   Names YAML reads as boolean or null (yes, no, on, off, true, null,
#     #   ...) are refused at load.
#     #   Empty = the default, unreagent.
#     # configPath: ""            # empty = $HERMES_HOME/config.yaml or ~/.hermes/config.yaml (takes placeholders)

# ------------------------------------------------------------
# unreal: and commands: are OPTIONAL. The editor path as well as the
# "compile" and "package" commands are derived automatically from
# ${ENGINE} + ${PROJECT}. Only override when needed:
#
# compile and package exist only when both ${ENGINE} and ${PROJECT} resolve;
# otherwise they are skipped with a warning at start. A command of the same
# name defined here replaces the built-in.
#
# unreal:
#   # The .uproject to open. Absolute, or relative to the directory of THIS
#   # config file; it must exist, and it takes NO placeholders (they are
#   # derived from it). Default: the first .uproject next to the config.
#   # project: "MyGame/MyGame.uproject"
#   # args REPLACES the default ["-stdout", "-FullStdOutLogOutput"] (the .uproject
#   # is always prepended) — give the full list. A list in local.yaml replaces it
#   # too. Unset or "args: ~" = the default; "args: []" = no extra arguments.
#   args: ["-stdout", "-FullStdOutLogOutput", "-nosplash"]
#   # Restart policy: never | on-failure (default) | always. With maxRestarts: 0
#   # (the default) a fast-fail rule applies: an editor that FAILS (non-zero
#   # exit or failed start) 3 times in a row, each within 10s of its start, is
#   # not restarted again; one log line says so. A clean exit 0, a run longer
#   # than 10s, or a manual ue_start/restart resets the count. An explicit
#   # maxRestarts > 0 keeps exactly that bound and the rule is off.
#   # A second rule, for the editor only and also with maxRestarts: 0: 3 failed
#   # runs in a row, each ending within 5 minutes of its start, stop the
#   # restarts too (one log line; the launcher keeps running). A run of 5
#   # minutes or more, an exit 0 or a manual ue_start/ue_restart/"start ue"
#   # resets that count. There is no option for the 5 minutes. An editor that
#   # fails only after more than 5 minutes is still restarted without end.
#   restart: on-failure
#   maxRestarts: 0            # default 0 (5 = give up after 5 restarts)
#   restartDelaySeconds: 3    # default 3 (0 = default); below 0 is a load error
#   unattended: true          # -unattended: no crash dialog, package-restore prompt skipped (default on;
#                             # the restore offer is kept until a clean exit, not discarded)
#   killCrashReporter: true   # NO EFFECT (still accepted; setting it logs a startup WARN): the launcher
#                             # kills no crash reporter before a start. After a failed editor exit
#                             # the job stays open up to 30 s for the crash reporter, and the next
#                             # start waits for it; remove this line
#   cleanOnRestart: false     # remove Saved/Autosaves/PackageRestoreData.json before every start (default off);
#                             # Saved/Crashes is emptied before a start that does not follow a crash —
#                             # kept on an automatic restart, on a start issued in place of a pending
#                             # one (during the restart delay) and on the first start after a give-up,
#                             # so the crash dumps survive; a stop during the delay cancels the
#                             # pending restart, so a start after it empties Saved/Crashes
#
# commands:
#   cook:
#     description: "Cook content only"
#     command: "${ENGINE}/Engine/Build/BatchFiles/RunUAT.bat"
#     args: ["BuildCookRun", "-project=${PROJECT}", "-noP4", "-cook", "-skipstage"]
# ------------------------------------------------------------

# ============================================================
#  Example  unreagent.local.yaml  (do NOT commit — git-ignored):
#
#    engineRoot: "D:/UE/UE_5.8"        # if auto-detect fails (a relative path
#                                      # resolves against the working directory)
#    agent:
#      command: "C:/Path/To/claude.exe"  # claude not in PATH
# ============================================================
