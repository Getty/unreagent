# ============================================================
#  unreagent — committable project configuration
#
#  Rename this file to  unreagent.yaml  and place it next to the
#  .uproject (and next to unreagent.exe). It is portable and belongs
#  in the project repo.
#
#  NO machine-specific paths here! They are resolved automatically and
#  substituted via placeholders:
#    ${ENGINE}        UE installation root (env UE_ROOT / auto-detected)
#    ${PROJECT}       full path to the .uproject (auto-detected alongside)
#    ${PROJECT_DIR}   directory containing the .uproject
#    ${PROJECT_NAME}  name of the .uproject without extension
#
#  Machine-specific overrides (engine path, claude path …) belong in a
#  git-ignored  unreagent.local.yaml  — example at the very bottom.
# ============================================================

agent:
  enabled: true
  command: claude
  # Automatically appends --mcp-config (+ --permission-prompt-tool) to the
  # claude invocation — no manual setup needed.
  claudeIntegration: true
  # Interactive in the foreground (agent inherits the console = real TTY) is the DEFAULT.
  # UE runs in the background, launcher logs -> unreagent.log. Turn off with
  # window: false — e.g. for headless: args: ["-p", "<task>"] (then window off).
  # window: false
  # args: ["-p", "Start and work through the tasks"]   # one-off headless
  # On Windows (with claudeIntegration) CLAUDE_CODE_USE_POWERSHELL_TOOL=1 is
  # set automatically; disable with powershellTool: false.
  # powershellTool: false
  # What happens when the agent exits (e.g. /quit) and isn't restarted?
  # In window mode the agent is the lead process — when it exits, that's it.
  #   ask (default): prompt in the window (stop everything / keep the editor
  #     running -> launcher console / restart the agent; 30s timeout -> stop;
  #     headless without a TTY = shutdown)
  #   shutdown: always stop the whole stack (UE + MCP + launcher) immediately
  #   leave: keep everything running (warning only) — manual Ctrl-C needed
  # onExit: ask

permissions:
  enabled: true
  mode: allow_all            # allow_all | allowlist | deny_all (default if unset: allowlist)
  deny:
    - "Bash(rm -rf *)"
  # `Bash(...)` rules match per shell segment, not the whole command line: the
  # command is split on ; && || | newlines, $(...)/backtick bodies, and a
  # script handed to a nested `bash -c`/`sh -c`. A deny rule blocks if ANY
  # segment matches; an allow rule below only grants if EVERY segment is
  # covered by some allow rule — e.g. "git status | head" needs BOTH
  # "Bash(git *)" and "Bash(head *)". Bracket rules also work on non-Bash
  # tools, matched against their path-like input, e.g. "Write(/etc/*)". On
  # Windows use "PowerShell(...)" instead of "Bash(...)". Full details +
  # caveats: README "### Permission layer".
  #
  # Under mode: allowlist this list is consulted instead — everything not
  # matched by an allow rule is rejected:
  # allow: ["Read", "Edit", "Write", "Bash(git *)", "mcp__unreagent__*"]

runtimes:
  python:
    enabled: true
    prepareOnStart: true     # uv sync on start, if pyproject.toml is present
  node:
    enabled: true

# File tools (read_file/list_dir/write_file/edit_file) via the MCP server.
# Handy together with `-no-agent`: UE + MCP run, an external agent
# connects and works on the project without anyone present locally.
# Quick via flag: unreagent.exe -files   (or -no-agent for UE+MCP only)
files:
  enabled: false
  root: "${PROJECT_DIR}"     # all paths strictly confined to this
  readOnly: false            # true = read-only

mcp:
  enabled: true
  address: 127.0.0.1:8765
  # Optional bearer token: when set, the MCP server requires an
  # "Authorization: Bearer <token>" header on every request. Default empty
  # (= open), compatible with prior behavior and local-only setups.
  # Recommendation: set it as soon as the MCP server listens on an address
  # other than 127.0.0.1. The launcher writes the token into the Hermes MCP
  # entry (`unreagent hermes-setup`) and into the embedded agent (Claude
  # Code) automatically — no manual copy needed.
  # token: "changeme-please-rotate"
  # Additional in-editor MCP servers the agent uses to work IN the engine
  # (e.g. UE LLM Toolkit: Node bridge -> HTTP server in the editor on port 3000).
  # Passed together with the unreagent server in --mcp-config.
  # Stdio servers are fully checked before start — every stage complains
  # loudly in the log instead of failing silently:
  #   Binary in PATH? -> Node: script there? node_modules there? (else npm install)
  #   -> smoke test (initialize handshake) -> is UNREAL_MCP_URL reachable?
  # strict: false   # true = ONLY these servers (ignore the project's own .mcp.json)
  # extraServers:
  #   ue-llm-toolkit:
  #     command: node
  #     args: ["${PROJECT_DIR}/Plugins/UELLMToolkit/Resources/mcp-bridge/index.js"]
  #     env:
  #       UNREAL_MCP_URL: "http://127.0.0.1:3000"
  # Also write the MCP config as file(s) (for external clients like
  # your own Claude session, Cursor, VS Code). Also via flag: -write-mcp-config
  # writeConfig:
  #   - { path: ".mcp.json", format: mcp_json }       # Claude Code / Cursor / Claude Desktop
  #   - { path: ".vscode/mcp.json", format: vscode }  # VS Code

# Hermes Agent (Nous Research) as an alternative agent. Activation is
# explicit via the sub-command `unreagent hermes-setup` — no auto-merge on
# normal start. Setup writes our MCP server (with bearer token) into
# $HERMES_HOME/config.yaml (default ~/.hermes/config.yaml).
# agent:
#   hermes:
#     enabled: true
#     # serverName: unreagent     # key under mcp_servers
#     # configPath: ""            # empty = $HERMES_HOME/config.yaml or ~/.hermes/config.yaml

# ------------------------------------------------------------
# unreal: and commands: are OPTIONAL. The editor path as well as the
# "compile" and "package" commands are derived automatically from
# ${ENGINE} + ${PROJECT}. Only override when needed:
#
# unreal:
#   args: ["-stdout", "-FullStdOutLogOutput", "-nosplash"]
#   restart: on-failure
#   maxRestarts: 5
#   unattended: true          # -unattended: no crash dialog + no recovery prompt (default on)
#   killCrashReporter: true   # kill a hanging CrashReportClientEditor.exe (default on)
#   cleanOnRestart: false     # clear Saved/Autosaves/PackageRestoreData.json + Saved/Crashes before start
#
# commands:
#   cook:
#     description: "Cook content only"
#     command: "${ENGINE}/Engine/Build/BatchFiles/RunUAT.bat"
#     args: ["BuildCookRun", "-project=${PROJECT}", "-noP4", "-cook", "-skipstage"]
# ------------------------------------------------------------

# ============================================================
#  Example  unreagent.local.yaml  (do NOT commit — git-ignored):
#
#    engineRoot: "D:/UE/UE_5.7"        # if auto-detect fails
#    agent:
#      command: "C:/Users/me/AppData/Roaming/npm/claude.cmd"  # claude not in PATH
# ============================================================
