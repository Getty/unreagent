name: ci

# Quality gate: runs on every push to main and on every pull request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true # binary assets (icon.*, resource_windows_amd64.syso) live in LFS

      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache: false # dependencies are vendored, the build never fetches modules

      - name: gofmt
        run: |
          # vendor/ is third-party code and is not checked.
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        # -race needs cgo, which is fine here: this runs natively on the Linux
        # runner, unlike the Windows cross-compile below.
        run: go test ./... -count=1 -race

      - name: Build (Linux + Windows)
        run: |
          set -e
          go build ./...
          # Cross-compile to Windows without cgo: the runner's gcc is a Linux one
          # and does not know the Windows -mconsole flag. The project has no cgo
          # code (only vendored Go packages), so CGO_ENABLED=0 is safe.
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./cmd/launcher
          GOOS=linux   GOARCH=amd64 go build -o /dev/null ./cmd/launcher
