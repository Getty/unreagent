name: ci

# Quality gate: runs on every push to main and on every pull request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true # binary assets (icon.*, resource_windows_amd64.syso) live in LFS

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x" # latest patch; move to the next minor before this one leaves support
          cache: false # dependencies are vendored, the build never fetches modules

      - name: gofmt
        run: |
          # vendor/ is third-party code and is not checked.
          unformatted="$(gofmt -l cmd internal skills agents)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Release notes from Changes
        # release.yml builds the release notes with scripts/changes-section.sh,
        # but only on a tag push. Run it here on the newest stamped version, so
        # a broken script or Changes layout shows up before a tag does.
        run: |
          # Stamping a release keeps {{$NEXT}} above the new version line.
          if ! awk '{ sub(/\r$/, "") } $1 == "{{$NEXT}}" { found = 1; exit } END { exit !found }' Changes; then
            echo 'No {{$NEXT}} line in Changes'
            exit 1
          fi
          # The newest stamped version is the first version line after {{$NEXT}}.
          version="$(awk '{ sub(/\r$/, "") } seen && /^[^ \t]/ { print $1; exit } $1 == "{{$NEXT}}" { seen = 1 }' Changes)"
          if [ -z "$version" ]; then
            echo 'No version line after {{$NEXT}} in Changes'
            exit 1
          fi
          notes="$(scripts/changes-section.sh "$version")"
          if [ -z "$notes" ]; then
            echo "scripts/changes-section.sh printed no release notes for $version"
            exit 1
          fi
          echo "Release notes for $version:"
          echo "$notes"
          # The refusal of {{$NEXT}} is checked on a fixture with an entry under
          # {{$NEXT}}: without the refusal the script prints that entry. On the
          # real Changes an empty {{$NEXT}}, as right after a release, makes the
          # script fail anyway and would hide a removed refusal.
          changes_fixture() { # $1: the heading of the first section
            printf '%s\n' 'Revision history for the fixture' '' "$1" '  - An unreleased entry.' '' '0.0.1  2026-01-01' '  - A released entry.'
          }
          fixture="$(mktemp)"
          # Positive control: under a version heading the same section prints,
          # so the refusal below is the refusal, not a broken fixture or script.
          changes_fixture 0.0.2 > "$fixture"
          if [ "$(scripts/changes-section.sh 0.0.2 "$fixture")" != '- An unreleased entry.' ]; then
            echo 'scripts/changes-section.sh does not print the fixture section, so the {{$NEXT}} check proves nothing'
            exit 1
          fi
          changes_fixture '{{$NEXT}}' > "$fixture"
          if scripts/changes-section.sh '{{$NEXT}}' "$fixture" > /dev/null 2>&1; then
            echo 'scripts/changes-section.sh accepted {{$NEXT}}, which is not a version'
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        # -race needs cgo, which is fine here: this runs natively on the Linux
        # runner, unlike the Windows cross-compile below.
        run: go test ./... -count=1 -race

      - name: Build (Linux + Windows)
        run: |
          set -e
          go build ./...
          # Cross-compile to Windows without cgo: the runner's gcc is a Linux one
          # and does not know the Windows -mconsole flag. The project has no cgo
          # code (only vendored Go packages), so CGO_ENABLED=0 is safe.
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./cmd/launcher
          GOOS=linux   GOARCH=amd64 go build -o /dev/null ./cmd/launcher
