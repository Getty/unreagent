name: release

# Triggered by pushing a version tag, e.g. v0.0.1.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # required to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true # binary assets (icon.*, resource_windows_amd64.syso) live in LFS

      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache: false # dependencies are vendored, the build never fetches modules

      - name: go test
        # A tag must not publish a binary that was never tested: ci.yml only
        # gates main and pull requests, not the tag push that lands here.
        run: go test ./... -count=1

      - name: Build (Windows + Linux)
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          # Same CGO_ENABLED=0 as in ci.yml: the runner's gcc is a Linux one and
          # rejects the Windows -mconsole flag. The project has no cgo code.
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-s -w -X main.version=${VERSION}" -o dist/unreagent.exe ./cmd/launcher
          GOOS=linux   GOARCH=amd64 go build -ldflags "-s -w -X main.version=${VERSION}" -o dist/unreagent     ./cmd/launcher

      - name: Package
        run: |
          set -e
          cp unreagent.example.yaml README.md dist/
          # demo config as unreagent.yaml -> the exe runs straight out of the archive
          cp example/unreagent.yaml dist/unreagent.yaml
          cd dist
          zip "unreagent-${GITHUB_REF_NAME}-windows-amd64.zip" unreagent.exe unreagent.yaml unreagent.example.yaml README.md
          tar czf "unreagent-${GITHUB_REF_NAME}-linux-amd64.tar.gz" unreagent unreagent.yaml unreagent.example.yaml README.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.zip dist/*.tar.gz \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
