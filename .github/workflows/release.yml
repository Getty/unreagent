name: release

# Triggered by pushing a version tag, e.g. v0.0.1.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # required to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true # binary assets (icon.*, resource_windows_amd64.syso) live in LFS
          fetch-depth: 0 # full history and tags: the release notes link the previous tag

      - name: Release notes from Changes
        # Runs first so that a tag without a stamped, non-empty Changes section
        # fails before anything is built or published.
        run: |
          set -e
          notes="${RUNNER_TEMP}/release-notes.md"
          scripts/changes-section.sh "${GITHUB_REF_NAME#v}" > "$notes"
          prev="$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$prev" ]; then
            printf '\n**Full Changelog**: %s/%s/compare/%s...%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$prev" "$GITHUB_REF_NAME" >> "$notes"
          else
            # Expected for the first release only. Otherwise the checkout is
            # shallow and the previous tag is missing: keep fetch-depth: 0.
            echo "::warning::No earlier v* tag found before ${GITHUB_REF_NAME}; the release notes have no Full Changelog link (shallow clone? the checkout needs fetch-depth: 0)"
          fi
          cat "$notes"

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x" # latest patch; move to the next minor before this one leaves support
          cache: false # dependencies are vendored, the build never fetches modules

      - name: go test
        # A tag must not publish a binary that was never tested: ci.yml only
        # gates main and pull requests, not the tag push that lands here.
        run: go test ./... -count=1

      - name: Build (Windows + Linux)
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          # Same CGO_ENABLED=0 as in ci.yml: the runner's gcc is a Linux one and
          # rejects the Windows -mconsole flag. The project has no cgo code.
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-s -w -X main.version=${VERSION}" -o dist/unreagent.exe ./cmd/launcher
          GOOS=linux   GOARCH=amd64 go build -ldflags "-s -w -X main.version=${VERSION}" -o dist/unreagent     ./cmd/launcher

      - name: Package
        run: |
          set -e
          # LICENSE is the project's own license; NOTICE carries the third-party (MIT) attribution for text embedded in the binary
          cp unreagent.example.yaml README.md LICENSE NOTICE dist/
          # demo config as unreagent.yaml -> the exe runs straight out of the archive
          cp example/unreagent.yaml dist/unreagent.yaml
          cd dist
          zip "unreagent-${GITHUB_REF_NAME}-windows-amd64.zip" unreagent.exe unreagent.yaml unreagent.example.yaml README.md LICENSE NOTICE
          tar czf "unreagent-${GITHUB_REF_NAME}-linux-amd64.tar.gz" unreagent unreagent.yaml unreagent.example.yaml README.md LICENSE NOTICE

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.zip dist/*.tar.gz \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md"
